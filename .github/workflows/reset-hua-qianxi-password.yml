name: Reset Hua Qianxi password

on:
  workflow_dispatch:

jobs:
  reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Reset password
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          RESET_PASSWORD: ${{ secrets.HUA_QIANXI_RESET_PASSWORD }}
        run: |
          test -n "$RESET_PASSWORD"
          ssh "${ALIYUN_USER}@${ALIYUN_HOST}" \
            "sudo find /tmp -maxdepth 1 -type f -name 'wisdomloong-*.tgz' -delete; if [ -d /srv/wisdomloong/releases ]; then sudo find /srv/wisdomloong/releases -mindepth 1 -maxdepth 1 -type d ! -samefile /srv/wisdomloong/current -exec rm -rf -- {} +; fi; sudo systemctl restart postgresql; for attempt in \$(seq 1 60); do sudo -u postgres pg_isready --dbname=wisdomloong && exit 0; sleep 2; done; exit 1"
          PASSWORD_HASH="$(node -e "const {randomBytes,scryptSync}=require('node:crypto');const s=randomBytes(16);process.stdout.write('scrypt:'+s.toString('base64')+':'+scryptSync(process.env.RESET_PASSWORD,s,64).toString('base64'))")"
          ssh "${ALIYUN_USER}@${ALIYUN_HOST}" \
            "sudo -u postgres psql --dbname=wisdomloong --set=ON_ERROR_STOP=1 --set=password_hash='$PASSWORD_HASH' --command=\"UPDATE users SET password_hash = :'password_hash' WHERE username_key = 'hua, qianxi';\""
