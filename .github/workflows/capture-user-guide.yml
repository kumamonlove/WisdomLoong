name: Capture user guide screenshots

on:
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install browser driver
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
          npm install --no-save --package-lock=false playwright-core@1.55.0

      - name: Configure cleanup access
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Capture current production pages
        env:
          GUIDE_INVITE_CODE: ${{ secrets.REGISTRATION_INVITE_CODE }}
          GUIDE_PASSWORD: Guide-${{ github.run_id }}-${{ github.run_attempt }}!
          GUIDE_USERNAME: guide_demo_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          mkdir -p guide-screenshots
          node <<'NODE'
          const { chromium } = await import('playwright-core');

          const baseUrl = 'https://wisdomloong.com';
          const browser = await chromium.launch({
            executablePath: '/usr/bin/google-chrome',
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const context = await browser.newContext({
            locale: 'zh-CN',
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });
          const page = await context.newPage();
          page.on('response', (response) => {
            if (response.status() >= 500) console.error(`HTTP_${response.status()} ${response.url()}`);
          });
          page.on('pageerror', (error) => console.error(`PAGE_ERROR ${error.message}`));
          const useReadableGuideName = async () => {
            await page.evaluate((username) => {
              const replacement = '手册演示账号';
              const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
              let node;
              while ((node = walker.nextNode())) {
                if (node.nodeValue?.includes(username)) node.nodeValue = node.nodeValue.replaceAll(username, replacement);
              }
              document.querySelectorAll('input').forEach((input) => {
                if (input.value.includes(username)) input.value = input.value.replaceAll(username, replacement);
              });
            }, process.env.GUIDE_USERNAME);
          };
          const shot = async (name) => {
            await page.waitForTimeout(700);
            if (!name.startsWith('01-') && !name.startsWith('02-')) {
              await useReadableGuideName();
              await page.waitForTimeout(50);
            }
            await page.screenshot({ path: `guide-screenshots/${name}.png`, fullPage: false });
          };

          await page.goto(`${baseUrl}/login`, { waitUntil: 'domcontentloaded' });
          await shot('01-login');
          await page.goto(`${baseUrl}/register`, { waitUntil: 'domcontentloaded' });
          await shot('02-register');

          await page.locator('input[name="username"]').fill(process.env.GUIDE_USERNAME);
          await page.locator('input[name="password"]').fill(process.env.GUIDE_PASSWORD);
          await page.locator('input[name="invitationCode"]').fill(process.env.GUIDE_INVITE_CODE);
          await Promise.all([
            page.waitForURL(`${baseUrl}/`, { timeout: 30000 }),
            page.getByRole('button', { name: '创建账号' }).click(),
          ]);

          await page.goto(`${baseUrl}/categories`, { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('.article-card');
          const readerHref = await page.locator('.article-card h3 a').first().getAttribute('href');
          await shot('03-article-library');
          const metadata = page.locator('.card-metadata-editor').first();
          await metadata.locator('summary').click();
          await metadata.scrollIntoViewIfNeeded();
          await shot('04-edit-metadata');

          await page.goto(`${baseUrl}/reading-list`, { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('.import-section');
          await shot('05-reading-list');

          for (let attempt = 1; attempt <= 12; attempt += 1) {
            await Promise.all([
              page.waitForURL(`${baseUrl}/categories`, { timeout: 30000 }),
              page.getByRole('link', { name: '知识分类' }).click(),
            ]);
            await page.waitForSelector('h1');
            if ((await page.locator('body').innerText()).includes('This page couldn’t load')) {
              throw new Error(`Navigation returned the global error page on attempt ${attempt}`);
            }
            await Promise.all([
              page.waitForURL(`${baseUrl}/reading-list`, { timeout: 30000 }),
              page.getByRole('link', { name: '待读列表' }).click(),
            ]);
            await page.waitForSelector('.import-section');
          }

          if (!readerHref) throw new Error('No article was available for the reader screenshots');
          await page.goto(`${baseUrl}${readerHref}`, { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('.reader-workspace.focus-mode');
          await page.waitForFunction(() => {
            const canvas = document.querySelector('.pdf-page-canvas canvas');
            return !document.querySelector('.pdf-loading') &&
              canvas instanceof HTMLCanvasElement && canvas.width > 0 && canvas.height > 0;
          }, { timeout: 45000 });
          await page.waitForTimeout(1000);
          await shot('06-reader-annotations');

          const translationTab = page.locator('.workspace-tabs button').filter({ hasText: '翻译' }).first();
          if (await translationTab.count()) await translationTab.click();
          await shot('07-translation');

          const publishTab = page.locator('.workspace-tabs button').filter({ hasText: '发布' }).first();
          if (await publishTab.count()) await publishTab.click();
          await shot('08-publish');

          await page.goto(`${baseUrl}/profile`, { waitUntil: 'domcontentloaded' });
          await page.waitForSelector('.profile-stats');
          await shot('09-profile');
          await browser.close();
          NODE

      - name: Remove temporary guide account
        if: always()
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          GUIDE_USERNAME: guide_demo_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          ssh "${ALIYUN_USER}@${ALIYUN_HOST}" \
            "sudo -u postgres psql --dbname=wisdomloong --set=ON_ERROR_STOP=1 --command=\"DELETE FROM users WHERE username_key = '${GUIDE_USERNAME}';\""

      - name: Show recent production errors
        if: always()
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          ssh "${ALIYUN_USER}@${ALIYUN_HOST}" \
            "sudo journalctl -u wisdomloong --since '30 minutes ago' --no-pager -n 300 || true"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: user-guide-screenshots
          path: guide-screenshots
          if-no-files-found: error
          retention-days: 7
