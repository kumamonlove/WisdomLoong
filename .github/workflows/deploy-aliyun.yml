name: Deploy to Alibaba Cloud

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: aliyun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package application
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi
          find .next/standalone/.next/static -type f \
            \( -name '*.js' -o -name '*.css' -o -name '*.svg' -o -name '*.json' \) \
            -exec gzip -9 -k {} \;
          tar -C .next/standalone -czf "/tmp/wisdomloong-${GITHUB_SHA}.tgz" .

      - name: Configure SSH
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_SSH_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ALIYUN_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ALIYUN_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          REGISTRATION_INVITE_CODE: ${{ secrets.REGISTRATION_INVITE_CODE }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_BASE_URL: ${{ secrets.TRANSLATION_BASE_URL }}
          TRANSLATION_MODEL: ${{ secrets.TRANSLATION_MODEL }}
        run: |
          if [ -z "$REGISTRATION_INVITE_CODE" ]; then
            echo "REGISTRATION_INVITE_CODE secret is required" >&2
            exit 1
          fi
          umask 077
          printf 'REGISTRATION_INVITE_CODE=%s\n' \
            "$REGISTRATION_INVITE_CODE" > /tmp/wisdomloong.env
          if [ -n "$DASHSCOPE_API_KEY" ]; then
            printf 'DASHSCOPE_API_KEY=%s\n' "$DASHSCOPE_API_KEY" \
              >> /tmp/wisdomloong.env
          fi
          if [ -n "$DASHSCOPE_BASE_URL" ]; then
            printf 'DASHSCOPE_BASE_URL=%s\n' "$DASHSCOPE_BASE_URL" \
              >> /tmp/wisdomloong.env
          fi
          if [ -n "$TRANSLATION_API_KEY" ]; then
            printf 'TRANSLATION_API_KEY=%s\n' "$TRANSLATION_API_KEY" \
              >> /tmp/wisdomloong.env
          fi
          if [ -n "$TRANSLATION_BASE_URL" ]; then
            printf 'TRANSLATION_BASE_URL=%s\n' "$TRANSLATION_BASE_URL" \
              >> /tmp/wisdomloong.env
          fi
          if [ -n "$TRANSLATION_MODEL" ]; then
            printf 'TRANSLATION_MODEL=%s\n' "$TRANSLATION_MODEL" \
              >> /tmp/wisdomloong.env
          fi
          scp "/tmp/wisdomloong-${GITHUB_SHA}.tgz" \
            /tmp/wisdomloong.env \
            deploy/nginx.conf \
            deploy/prepare-database.sh \
            deploy/prewarm-pdfs.sh \
            deploy/schema.sql \
            deploy/wisdomloong.service \
            "${ALIYUN_USER}@${ALIYUN_HOST}:/tmp/"

      - name: Activate release
        env:
          ALIYUN_HOST: ${{ secrets.ALIYUN_HOST }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
        run: |
          ssh "${ALIYUN_USER}@${ALIYUN_HOST}" "
            set -eu
            release=/srv/wisdomloong/releases/${GITHUB_SHA}
            sudo install -d -o ${ALIYUN_USER} -g ${ALIYUN_USER} \"\$release\"
            tar -xzf /tmp/wisdomloong-${GITHUB_SHA}.tgz -C \"\$release\"
            rm /tmp/wisdomloong-${GITHUB_SHA}.tgz
            sudo install -m 600 -o root -g root /tmp/wisdomloong.env /etc/wisdomloong.env
            chmod +x /tmp/prepare-database.sh
            /tmp/prepare-database.sh
            sudo install -d -o ${ALIYUN_USER} -g ${ALIYUN_USER} \
              /srv/wisdomloong/pdf-cache
            chmod +x /tmp/prewarm-pdfs.sh
            PDF_CACHE_DIR=/srv/wisdomloong/pdf-cache /tmp/prewarm-pdfs.sh
            sudo ln -sfn \"\$release\" /srv/wisdomloong/current
            sudo install -m 644 /tmp/wisdomloong.service /etc/systemd/system/wisdomloong.service
            sudo install -m 644 /tmp/nginx.conf /etc/nginx/sites-available/wisdomloong
            sudo nginx -t
            sudo systemctl daemon-reload
            sudo systemctl restart wisdomloong
            sudo systemctl is-active --quiet wisdomloong
            sudo systemctl reload nginx
            sudo systemctl is-active --quiet nginx
          "
