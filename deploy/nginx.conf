server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name wisdomloong.com www.wisdomloong.com;

    return 301 https://wisdomloong.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name wisdomloong.com www.wisdomloong.com;

    ssl_certificate /etc/letsencrypt/live/wisdomloong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wisdomloong.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location ^~ /_next/static/ {
        alias /srv/wisdomloong/current/.next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    location ~ ^/api/articles/[0-9]+/pdf$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /_pdf_cache_internal/ {
        internal;
        alias /srv/wisdomloong/pdf-cache/;
        sendfile on;
        tcp_nopush on;
        add_header Cache-Control "private, max-age=2592000, immutable" always;
        add_header X-WisdomLoong-Delivery "nginx-sendfile" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
