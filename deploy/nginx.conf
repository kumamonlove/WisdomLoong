server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name wisdomloong.com www.wisdomloong.com;

    return 301 https://wisdomloong.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name wisdomloong.com www.wisdomloong.com;

    ssl_certificate /etc/letsencrypt/live/wisdomloong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wisdomloong.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
